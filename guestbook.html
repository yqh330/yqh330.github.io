<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e8eee7">
  <meta name="description" content="在杨·Yaᴗngᥫᩣ的温柔小站留下问候、想法与建议。无需注册账号。">
  <title>留言板 · 杨·Yaᴗngᥫᩣ温柔小站</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css">
  <style>
    .guestbook-wrap{max-width:900px;margin:0 auto 72px}
    .guestbook-intro{position:relative;overflow:hidden;padding:clamp(24px,5vw,42px);border:1px solid rgba(255,255,255,.72);border-radius:28px;background:rgba(255,255,255,.58);backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(67,91,72,.09)}
    .guestbook-intro:after{content:"✿";position:absolute;right:28px;bottom:-42px;font-size:170px;line-height:1;color:rgba(127,157,126,.10);pointer-events:none}
    .guestbook-intro h1{margin:8px 0 12px;font-size:clamp(32px,6vw,48px)}
    .guestbook-intro p{max-width:620px;margin:0;color:var(--muted,#68756a);line-height:1.9}
    .guestbook-hints{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
    .guestbook-hint{padding:8px 13px;border-radius:999px;background:rgba(232,240,229,.8);color:#617861;font-size:13px}
    .guestbook-board{margin-top:22px;padding:clamp(18px,4vw,30px);border:1px solid rgba(255,255,255,.8);border-radius:24px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);box-shadow:0 14px 42px rgba(67,91,72,.07)}
    .guestbook-board h2{margin:0 0 6px;font-size:21px}
    .guestbook-board>p{margin:0 0 20px;color:var(--muted,#68756a);font-size:14px;line-height:1.8}
    #waline{min-height:180px}
    .guestbook-config{padding:18px;border:1px dashed #b8cbb6;border-radius:16px;background:#f4f8f1;color:#526b53;line-height:1.8}
    .guestbook-config code{padding:2px 6px;border-radius:6px;background:#e5eee2}
    .wl-panel{border-color:rgba(135,160,132,.25)!important}
    .wl-btn{border-radius:12px!important}
    .wl-editor{border-radius:14px!important}
    @media(max-width:600px){.guestbook-intro,.guestbook-board{border-radius:20px}.guestbook-hints{gap:7px}}
  </style>
</head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">❧</span><span>杨·Yaᴗngᥫᩣ · 温柔小站</span></a><button class="menu-toggle" aria-label="打开导航菜单" aria-expanded="false">☰</button><nav class="nav-links"><a href="/">首页</a><a href="/about.html">关于我</a><a href="/games.html">小游戏</a><a href="/tools.html">实用工具</a><a href="/focus.html">效率中心</a><a href="/projects.html">项目</a><a href="/guestbook.html" aria-current="page">留言板</a><a href="/contact.html">联系</a></nav></div></header>
<main class="container page-main">
  <div class="guestbook-wrap">
    <section class="guestbook-intro">
      <div class="eyebrow">A LITTLE HELLO</div>
      <h1>留下你的<span class="gradient">小小心意。</span></h1>
      <p>欢迎来这里坐坐。分享你的想法、建议，或只是说声你好。无需注册 GitHub 或其他账号，填写昵称就可以参与交流。</p>
      <div class="guestbook-hints"><span class="guestbook-hint">🌿 免账号留言</span><span class="guestbook-hint">💌 支持回复</span><span class="guestbook-hint">🛡️ 友善交流</span></div>
    </section>
    <section class="guestbook-board">
      <h2>💬 留言与交流</h2>
      <p>昵称必填，邮箱可不填；留言提交后可能需要经过站长审核才会公开。请不要填写密码、手机号等隐私信息。</p>
      <div id="waline"><div class="guestbook-config">留言服务正在等待配置。完成下方部署步骤后，这里就会启用免登录留言。</div></div>
    </section>
  </div>
</main>
<footer class="site-footer"><div class="container footer-inner"><span>© <span data-year></span> 杨·Yaᴗngᥫᩣ · 温柔小站</span><span>保持好奇 · 慢慢生活 · 认真创造</span></div></footer>
<script src="/assets/js/main.js"></script>
<script type="module">
  // 部署 Waline 服务端后，将此处替换为你的 Vercel 服务地址，例如 https://your-waline.vercel.app
  const WALINE_SERVER_URL = "YOUR_WALINE_SERVER_URL";
  const target = document.querySelector("#waline");
  if (WALINE_SERVER_URL.startsWith("https://") && !WALINE_SERVER_URL.includes("YOUR_WALINE_SERVER_URL")) {
    import("https://unpkg.com/@waline/client@v3/dist/waline.js").then(({ init }) => {
      init({
        el: "#waline",
        serverURL: WALINE_SERVER_URL,
        lang: "zh-CN",
        pageview: false,
        comment: true,
        requiredMeta: ["nick"],
        wordLimit: [1, 1000],
        emoji: ["https://unpkg.com/@waline/emojis@1.2.0/weibo"],
        dark: "html.dark"
      });
    }).catch(() => {
      target.innerHTML = '<div class="guestbook-config">留言服务暂时无法加载，请稍后再试。</div>';
    });
  }
</script>
</body>
</html>
