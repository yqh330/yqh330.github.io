<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111b">
  <meta name="description" content="一个简单、干净的个人主页。">
  <title>我的主页</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0d16; --panel:rgba(25,25,40,.78); --text:#f4f1ff; --muted:#aaa6bd; --accent:#a78bfa; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text);
      background: radial-gradient(ellipse at 15% 15%, rgba(124,58,237,.22), transparent 42%),
                  radial-gradient(ellipse at 85% 85%, rgba(59,130,246,.15), transparent 40%), var(--bg);
    }
    .card {
      width:min(100%,680px); padding:clamp(30px,7vw,58px); text-align:center;
      background:var(--panel); border:1px solid rgba(196,181,253,.18);
      border-radius:26px; box-shadow:0 24px 80px rgba(0,0,0,.35); backdrop-filter:blur(14px);
    }
    .mark {
      width:72px;height:72px;margin:0 auto 24px;display:grid;place-items:center;
      border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#4f46e5);
      font-size:30px;font-weight:800;box-shadow:0 10px 35px rgba(124,58,237,.35);
    }
    .eyebrow { color:var(--accent);font-size:12px;letter-spacing:.22em;text-transform:uppercase; }
    h1 { margin:12px 0 14px;font-size:clamp(32px,7vw,48px);letter-spacing:-.04em; }
    p { margin:0 auto;color:var(--muted);line-height:1.9;max-width:440px;font-size:15px; }
    .links { display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px; }
    a { color:#eee9ff;text-decoration:none;padding:11px 18px;border:1px solid rgba(196,181,253,.25);
        border-radius:999px;font-size:14px;transition:.2s ease; }
    a:hover { background:rgba(167,139,250,.15);border-color:var(--accent);transform:translateY(-2px); }
    footer { margin-top:36px;color:#77738b;font-size:12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">Y</div>
    <div class="eyebrow">WELCOME TO MY SPACE</div>
    <h1>你好，欢迎来到我的主页</h1>
    <p>这里是我的小小网络空间。保持好奇，持续学习，认真创造。<br>很高兴你来访！</p>
    <nav class="links" aria-label="相关链接">
      <a href="https://github.com/yqh330" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://github.com/yqh330/yqh.github.io" target="_blank" rel="noopener noreferrer">项目仓库</a>
    </nav>
    <footer>© <span id="year"></span> · Made with care</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
